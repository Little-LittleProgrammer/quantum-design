packages:
  # 配置/规范相关
  - "configs/*"
  # 内部共享包（工具、组件等），排除 @vue3-antd-pc-ui-nuxt/ 和 @vue3-pc-ui-nuxt/
  - "packages/*"
  - "!**/*-ui-nuxt/**"
  # 文档站点与文档工程
  - "docs/*"
  # CLI 工具集合
  - "cli/*"
  # 应用（示例/演示）
  - "apps/playground"
  # 服务端脚本与服务
  - "server/**/*"

