packages:
  # 配置/规范相关（存放各类项目配置、规范、预设等包）
  - "configs/*"
  # 内部共享包（工具、组件等），排除 @vue3-antd-pc-ui-nuxt/ 和 @vue3-pc-ui-nuxt/
  # 用于存放可复用的工具库、组件库等内部 npm 包
  - "packages/*"
  - "!**/*-ui-nuxt/**"
  # 文档站点与文档工程（项目文档、组件文档等相关工程）
  - "docs/*"
  # CLI 工具集合（自定义命令行工具相关包）
  - "cli/*"
  # 应用（示例/演示）（用于存放示例应用、演示项目等）
  - "apps/playground"
  # 服务端脚本与服务（后端脚本、API 服务等相关包）
  - "server/**/*"

catalog:
