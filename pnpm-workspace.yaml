  "@commitlint/cli": "^19.8.0"
  # @commitlint/config-conventional: 约定式 commitlint 规则
  "@commitlint/config-conventional": "^19.8.0"
  # commitlint-plugin-function-rules: commitlint 自定义函数规则插件
  "commitlint-plugin-function-rules": "^4.0.2"

  # Lint/类型检查
