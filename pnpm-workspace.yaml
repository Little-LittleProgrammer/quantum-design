  "@changesets/cli": "^2.29.5"

  # Git hooks 与工作流
  # husky: Git hooks 工具
  "husky": "^9.1.6"
  # lint-staged: 针对暂存文件运行 lint
  "lint-staged": "^15.2.10"

  # Commitlint 规则
